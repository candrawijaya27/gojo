<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Alert Stream</title>
    <!-- Mengambil Font Bergaya Bubble (Fredoka) dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Hubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Struktur Kotak Alert -->
    <div id="alertBox" class="alert-container">
        <div class="alert-content">
            <div class="alert-text-area">
                <div id="alertTitle" class="alert-title">Media Share Alert</div>
                <div id="alertUsername" class="alert-username">Azel Gaming</div>
                <div id="alertMessage" class="alert-message">Mantap banget stream-nya! Lanjutkan terus bang! 🔥</div>
            </div>
        </div>
    </div>

    <!-- Hubungkan JavaScript -->
    <script src="script.js"></script>
</body>
</html>
